name: Release

# Publishes the three NuGet packages when a version tag is pushed, e.g. v1.0.0 or v1.1.0-rc.1. See docs/releasing.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --solution DK.Gov.Oio.Saml.slnx --configuration Release

  # The .NET Framework package builds only on Windows, so all three packages are built there.
  pack:
    name: Pack
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE."; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Releases are tagged on main only."; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: .NET Framework tests
        run: dotnet test --project test/DK.Gov.Oio.Saml.AspNet.Tests --configuration Release

      - name: Pack
        run: dotnet pack DK.Gov.Oio.Saml.slnx --configuration Release -p:Version=${{ env.VERSION }} --output packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages
          if-no-files-found: error

  # Trusted Publishing: nuget.org exchanges the workflow's OIDC token for a short-lived API key, so no key is stored here.
  # The nuget environment requires a reviewer's approval before anything is published.
  publish:
    name: Publish to nuget.org
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing a .nupkg also pushes the .snupkg next to it.
      - name: Push
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
